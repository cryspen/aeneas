# Standalone crate: intentionally NOT part of the rust/ cargo workspace.
# The empty [workspace] table below stops cargo from walking up the directory
# tree and adopting a parent workspace (rust/ has its own).
[workspace]

[package]
name = "aeneas-fuzz"
version = "0.1.0"
edition = "2021"
description = "Phase-1 fuzzing harness for the Aeneas Rust->Lean translator"
license = "Apache-2.0"

[lib]
name = "aeneas_fuzz"
path = "src/lib.rs"

[[bin]]
name = "aeneas-fuzz"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing", "clone-impls"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wait-timeout = "0.2"
regex = "1"

[profile.release]
opt-level = 2
