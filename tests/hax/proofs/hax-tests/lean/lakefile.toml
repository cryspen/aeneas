# Builds the Lean code `cargo hax` extracts from the hax test crate, against
# the aeneas Lean library of this checkout and the hax Lean library of the hax
# checkout that `.hax-lean` links to (set up by `make test-hax HAX_DIR=...`).
name = "hax_tests"
defaultTargets = ["HaxTestsChecks"]

# The closures that aeneas extracts have names with `__` (e.g.
# `__18.requires.closure`), which Mathlib's naming linter reports on every build.
[leanOptions]
weak.linter.style.nameCheck = false

# Required before `hax`, so that this `aeneas` is the one hax's library builds
# against too, instead of the revision it pins.
[[require]]
name = "aeneas"
path = "../../../../../backends/lean"

[[require]]
name = "hax"
path = ".hax-lean"

# Every module under `HaxTests`, so that Lake can build any of them on demand (it
# only builds the modules matched by the globs of a library, or under a root they
# match). Not a default target: it includes the template of the proof
# obligations (`Extraction/ProofObligations.lean`, with `sorry`s).
[[lean_lib]]
name = "HaxTests"
globs = ["HaxTests.+"]

# What `lake build` checks: the extracted specs, and the handwritten proofs of
# their obligations (with everything they import).
[[lean_lib]]
name = "HaxTestsChecks"
roots = ["HaxTests.Extraction.Specs", "HaxTests.Verification.ProofObligations"]
