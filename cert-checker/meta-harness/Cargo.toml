[package]
name = "meta-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "meta-harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
toml = "0.8"
