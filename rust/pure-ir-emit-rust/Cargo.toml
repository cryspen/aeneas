[package]
name = "pure-ir-emit-rust"
version = "0.1.0"
edition = "2021"
description = "Phase 4 MVP: emit IR-faithful Rust source from Pure-IR JSON."

[dependencies]
pure-ir = { path = "../pure-ir" }
serde_json = { version = "1", features = ["unbounded_depth"] }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "pir2rs"
path = "src/bin/pir2rs.rs"

[[bin]]
name = "gen-diff-tests"
path = "src/bin/gen-diff-tests.rs"
