[package]
name = "pure-ir"
version = "0.1.0"
edition = "2021"
description = "Phase 1 Rust parser for the Aeneas Pure-IR JSON export."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
